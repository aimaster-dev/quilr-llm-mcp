[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quilr-customer-mcp"
version = "0.1.0"
description = "Customer-service MCP server (stdio) with strict input validation and JSON-RPC error mapping"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.11,<3",
  "anyio>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
customer-mcp = "customer_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
