[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quilr-llm-router"
version = "0.1.0"
description = "LLM gateway router: token-aware sliding-window rate limiter on SQLite and model failover"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.5",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "starlette>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
