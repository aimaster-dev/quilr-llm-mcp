[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quilr-llm-router"
version = "0.1.0"
description = "LLM gateway router: token-aware sliding-window rate limiter on SQLite and model failover"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.5,<5",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "starlette>=0.47,<2",
  "uvicorn>=0.30,<1",
  # Transitive (uvicorn, httpcore), pinned here as a security floor: h11 < 0.16 is
  # GHSA-vqfr-h8mv-ghfj (lenient chunked-encoding parsing, request smuggling).
  "h11>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
llm-router = "llm_router.__main__:main"
mock-llm-provider = "llm_router.mock_provider:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
