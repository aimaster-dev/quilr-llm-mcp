name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled. Runs on main are not: every main commit keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.3"
      - run: ruff check .
      - run: ruff format --check .

  discover:
    name: Discover task projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: find
        shell: bash
        run: |
          # nullglob: with no task*/ folders the loop must not run on the literal pattern.
          # if/fi instead of `[ ] && echo`: a folder without pyproject.toml must not end the loop
          # with status 1, which fails the step under `bash -e -o pipefail`.
          shopt -s nullglob
          projects=$(for d in task*/; do if [ -f "${d}pyproject.toml" ]; then echo "${d%/}"; fi; done | jq -R . | jq -cs .)
          echo "Found: ${projects}"
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.project }} (${{ matrix.os }})
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    runs-on: ${{ matrix.os }}
    # Generous: suites take well under 2 minutes. This only stops a hung test holding a runner for hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  # The one check branch protection requires. The test matrix has dynamic job names, so requiring
  # them one by one cannot work; this job fails if any job it depends on failed or was cancelled.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, discover, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # "skipped" is only possible for `test`, when discovery found no projects.
          echo "${RESULTS}" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
