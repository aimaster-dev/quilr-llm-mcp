name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.3"
      - run: ruff check .
      - run: ruff format --check .

  discover:
    name: Discover task projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        shell: bash
        run: |
          projects=$(for d in task*/; do [ -f "${d}pyproject.toml" ] && echo "${d%/}"; done | jq -R . | jq -cs .)
          echo "Found: ${projects}"
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.project }} (${{ matrix.os }})
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
