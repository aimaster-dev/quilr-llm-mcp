[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quilr-llm-stream-guardrail"
version = "0.1.0"
description = "Streaming PII guardrail for LLM responses: incremental redaction across chunk boundaries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "starlette>=0.40,<2",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "anyio>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
stream-guardrail = "stream_guardrail.__main__:main"
stream-guardrail-mock = "stream_guardrail.mock_provider:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
